<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的小屋</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#120c1a;}
</style>
</head>
<body>
<script src="room-engine.js"></script>
<script src="room-config.js"></script>
<script>
  window.addEventListener('load', function(){
    window.openLeonRoom();
    var back = document.getElementById('lrm-back');
    if(back) back.style.display = 'none';
    // 让 overlay 和 wrap 撑满整个视口
    var overlay = document.getElementById('leon-room-overlay');
    if(overlay){
      overlay.style.position = 'relative';
      overlay.style.height = '100vh';
      var wrap = document.getElementById('lrm-wrap');
      if(wrap) wrap.style.width = '100%';
    }
  });
</script>
</body>
</html>
